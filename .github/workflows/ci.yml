name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Verification scope
        type: choice
        options: [full, extended]
        default: full
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Select checks and inspect documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.scope.outputs.linux }}
      browser: ${{ steps.scope.outputs.browser }}
      windows: ${{ steps.scope.outputs.windows }}
      postgres: ${{ steps.scope.outputs.postgres }}
      package: ${{ steps.scope.outputs.package }}
      load: ${{ steps.scope.outputs.load }}
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify changes conservatively
        id: scope
        env:
          CI_PROFILE: ${{ inputs.profile || 'auto' }}
        run: node scripts/ci/classify.mjs
      - name: Check local documentation links and conflict markers
        run: node scripts/ci/check-docs.mjs
  checks:
    name: Selected verification
    needs: plan
    uses: ./.github/workflows/verify.yml
    with:
      linux: ${{ needs.plan.outputs.linux == 'true' }}
      browser: ${{ needs.plan.outputs.browser == 'true' }}
      windows: ${{ needs.plan.outputs.windows == 'true' }}
      postgres: ${{ needs.plan.outputs.postgres == 'true' }}
      package: ${{ needs.plan.outputs.package == 'true' }}
      load: ${{ needs.plan.outputs.load == 'true' }}
      extended: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'extended' }}
  qualification:
    name: Release qualification
    needs: [plan, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.outputs.qualified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record successful main release baseline
        run: echo 'This exact main commit passed the full release baseline.'
  result:
    name: CI result
    needs: [plan, checks, qualification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          for (const job of ['plan', 'checks']) {
            if (needs[job].result !== 'success') throw new Error(`${job}: ${needs[job].result}`);
          }
          const flags = ['linux', 'browser', 'windows', 'postgres', 'package', 'load'];
          const scope = needs.plan.outputs;
          if (flags.some(flag => !['true', 'false'].includes(scope[flag]))) throw new Error('Invalid or missing scope output');
          const full = flags.every(flag => scope[flag] === 'true');
          if (needs.checks.outputs.qualified !== String(full)) throw new Error('Verification qualification disagrees with selected scope');
          const expected = process.env.MAIN_PUSH === 'true' && full ? 'success' : 'skipped';
          if (needs.qualification.result !== expected) throw new Error(`Release qualification: expected ${expected}, got ${needs.qualification.result}`);
          console.log(`CI passed (${scope.profile}). All selected checks succeeded.`);
          NODE
